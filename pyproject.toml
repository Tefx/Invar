[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invar"]

[tool.hatch.build.targets.wheel.force-include]
"src/invar/templates/INVAR.md" = "invar/templates/INVAR.md"
"src/invar/templates/CLAUDE.md.template" = "invar/templates/CLAUDE.md.template"
"src/invar/templates/context.md.template" = "invar/templates/context.md.template"
"src/invar/templates/proposal.md.template" = "invar/templates/proposal.md.template"
"src/invar/templates/pre-commit-config.yaml.template" = "invar/templates/pre-commit-config.yaml.template"

[project]
name = "python-invar"
version = "0.5.0"
description = "AI-native software engineering framework with design-by-contract"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Invar Team" }
]
keywords = ["ai", "contracts", "design-by-contract", "code-quality", "static-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]

dependencies = [
    "typer>=0.9",
    "rich>=13.0",
    "pydantic>=2.0",
    "deal>=4.0",
    "returns>=0.20",
    "pre-commit>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1",
]

# DX-06: Verification tiers (agent doesn't need to know these exist)
# DX-12: Hypothesis added to prove as fallback for CrossHair
test = ["hypothesis>=6.0"]
prove = ["crosshair-tool>=0.0.60", "hypothesis>=6.0"]
full = ["hypothesis>=6.0", "crosshair-tool>=0.0.60"]

[project.scripts]
invar = "invar.shell.cli:app"

[project.urls]
Homepage = "https://github.com/tefx/invar"
Documentation = "https://github.com/tefx/invar#readme"
Repository = "https://github.com/tefx/invar"
Issues = "https://github.com/tefx/invar/issues"

# =============================================================================
# Tool Configuration
# =============================================================================

[tool.invar.guard]
# Directory classification
core_paths = ["src/invar/core"]
shell_paths = ["src/invar/shell"]

# Size limits
max_file_lines = 500
max_function_lines = 50

# Required for Core
require_contracts = true
require_doctests = true

# I/O modules forbidden in Core (static import check only)
forbidden_imports = [
    "os", "sys", "socket", "requests", "urllib",
    "subprocess", "shutil", "io", "pathlib"
]

# Paths to exclude from checking
exclude_paths = ["tests", "scripts", ".venv", "__pycache__"]

# Phase 3: Guard Enhancement
strict_pure = true          # Detect internal imports and impure calls in Core

# Function size counting options (mutually exclusive, pick ONE):
# - use_code_lines=true: Excludes entire docstring from count (focus on logic size)
# - exclude_doctest_lines=true: Subtracts doctest lines only (reward good examples)
# - Both false (default): Counts all lines
# WARNING: Don't enable both - doctests are inside docstrings, would double-exclude
use_code_lines = false
exclude_doctest_lines = true  # DX-15: Reward good doctests, don't penalize documentation

[tool.invar]
# Protocol governance
protocol_version = "3.20"
protocol_evolution = "human-approved"  # locked | human-approved | open

# Test style: "inline" or "separate"
test_style = "inline"

# =============================================================================
# Pytest Configuration
# =============================================================================

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
python_files = ["test_*.py", "*.py"]
python_functions = ["test_*"]
addopts = [
    "--doctest-modules",
    "-v",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

# =============================================================================
# Mypy Configuration
# =============================================================================

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_any_generics = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# =============================================================================
# Ruff Configuration
# =============================================================================

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate (commented code)
    "RUF",    # Ruff-specific
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "ARG001", # unused function argument (needed for interface consistency)
    "ARG005", # unused lambda argument (needed for interface consistency)
    "E402",   # imports not at top (cli.py uses lazy loading pattern)
    "B008",   # typer.Argument in defaults (Typer pattern)
    "B904",   # raise from clause (typer.Exit doesn't chain)
    "B005",   # strip with multi-char (intentional for path patterns)
    "SIM102", # nested if statements (improves readability in some cases)
]

[tool.ruff.lint.isort]
known-first-party = ["invar"]

# =============================================================================
# Coverage Configuration
# =============================================================================

[tool.coverage.run]
source = ["src/invar"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __debug__:",
]
