[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "python-invar"
version = "1.0.0"
description = "DEPRECATED: Use invar-tools (CLI) or invar-runtime (contracts) instead"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
authors = [{ name = "February Shi", email = "peterb2004@gmail.com" }]
keywords = ["deprecated", "invar", "contracts", "verification"]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "invar-tools>=1.0.0",
]

[project.urls]
"Homepage" = "https://github.com/Tefx/Invar"
"Migration Guide" = "https://github.com/Tefx/Invar/releases/tag/v1.0.0"
"New Package (tools)" = "https://pypi.org/project/invar-tools/"
"New Package (runtime)" = "https://pypi.org/project/invar-runtime/"

[tool.hatch.build.targets.wheel]
packages = ["src/python_invar"]
