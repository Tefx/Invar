      logic. Identify placeholder implementations that were never filled in. Handle
      class methods, standalone functions, and nested functions. Exempt abstract methods
      and protocol definitions.


      Files: src/invar/core/stub_body.py (new)

      Pattern: Follow src/invar/core/dead_export.py structure (RuleResult, AST walking)

      Tests: tests/core/test_stub_body.py'
