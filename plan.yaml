- id: dead-export-core
  name: 'dead_export Rule: Core Logic'
  status: done
  steps:
  - id: dead-export-core.implement-rule
    name: implement-rule
    status: done
    description: "Create src/invar/core/dead_export.py implementing the check_dead_exports()\
      \ function.\n\nFunction signature:\n  check_dead_exports(file_infos: list[FileInfo],\
      \ ref_counts: dict[str, int], config: RuleConfig) -> list[Violation]\n\nLogic:\n\
      1. Filter file_infos to is_shell=True files only.\n2. For each public function\
      \ (name not starting with _):\n   - Skip dunder methods (__init__, __all__,\
      \ etc.)\n   - Skip entry points: reuse is_entry_point() from entry_points.py\n\
      \   - Skip if has_allow_marker(symbol, source, \"dead_export\")\n   - key =\
      \ f\"{file_info.path}::{symbol.name}\"\n   - If ref_counts.get(key, 0) == 0\
      \ -> emit Violation(rule=\"dead_export\", severity=Severity.WARNING, ...)\n\
      3. Return list of violations.\n\nExclusion details:\n- Private: name.startswith(\"\
      _\")\n- Dunder: name.startswith(\"__\") and name.endswith(\"__\")\n- Entry points:\
      \ is_entry_point(symbol, file_info.source) — covers Click, Flask, Typer, pytest\n\
      - Escape hatch: # @invar:allow dead_export: <reason>\n\nDoctests MUST cover:\n\
      - Public shell function with ref_count=0 -> 1 violation\n- Public shell function\
      \ with ref_count>0 -> no violation\n- Private function (_prefixed) -> no violation\n\
      - Dunder (__init__) -> no violation\n- Entry-point decorated function -> no\
      \ violation\n- @invar:allow dead_export escape hatch -> no violation\n- Non-shell\
      \ file -> no violations"
    verification: '- src/invar/core/dead_export.py exists

      - check_dead_exports has @pre and @post contracts

      - All 7 doctest cases pass via invar_guard

      - No forbidden imports (no os/sys/pathlib/io)

      - Function is pure: receives data, no I/O'
