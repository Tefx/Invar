- id: dead-export-integration
  name: 'dead_export Rule: Guard Pipeline Integration'
  status: done
  steps:
  - id: dead-export-integration.integrate-guard
    name: integrate-guard
    status: done
    description: "Wire check_dead_exports into the guard pipeline in src/invar/shell/commands/guard.py.\n\
      \nPrerequisite: dead-export-core phase (all steps including gate) must be complete\
      \ before starting this step.\n\nIntegration point: _scan_and_check function\
      \ (lines ~64-111), after the per-file scan loop.\n\nChanges required:\n\n1.\
      \ In the scan loop body, accumulate all successful file_info objects:\n   all_file_infos:\
      \ list[FileInfo] = []\n   ...\n   all_file_infos.append(file_info)  # inside\
      \ the loop\n\n2. After the loop (alongside check_complexity_debt / check_duplicate_escape_reasons),\
      \ add:\n   from invar.core.dead_export import check_dead_exports\n   from invar.core.references\
      \ import count_cross_file_references\n   sources = {fi.path: fi.source for fi\
