  - id: wiring-integrity-1.wiring-gap-core
    name: wiring-gap-core
    status: done
    description: 'Highest-value rule: detects "forgot to wire" bugs — values constructed
      in scope but not passed to function calls that accept them as optional parameters.
      No existing tool (pyright, semgrep, ruff) catches this because the parameter
      has a default value, so not passing it is "legal."


      AST-based detection: at each function call site, collect local scope variables
      (assigned before the call). Resolve the callee''s optional parameters (parameters
      with default values) using the project-wide FileInfo symbol table already available
      in the guard pipeline. If a scope variable name matches an unpassed optional
      parameter name, emit warning.


      MVP scope (v1):

      - Name-match only (no type compatibility check — deferred to future iteration)

      - Same-project callee resolution only (use FileInfo symbol table + AST import
      tracking)

      - Conservative scope collection (only variables assigned via simple assignment
      before the call)

      - Graceful fallback: if callee cannot be resolved (third-party, dynamic), silently
      skip


      Exclusions: _ prefix variables, self/cls, variables already passed under different
      keyword, *args/**kwargs forwarding functions.


      Explicit None suppression: `Foo(x=None)` means "I know x exists but intentionally
      not passing it" — no warning. Only `Foo()` with x in scope and x not passed
      — warning.


      File: src/invar/core/wiring_gap.py

      Function: check_wiring_gaps(file_infos: list[FileInfo], config: RuleConfig)
      -> list[Violation]

      Pattern: Follow check_dead_exports() in src/invar/core/dead_export.py (same
      signature shape, same @pre/@post style, same doctest structure).

      Key difference: requires callee resolution via FileInfo symbol table.


      Returns list[Violation] with rule="wiring_gap", severity=WARNING.'
    verification: 'invar_guard passes on the new file. Doctests cover all 7 cases:

      1. Basic wiring gap (scope var matches unpassed optional param) — violation

      2. No warning when param IS passed explicitly

      3. No warning for required params (no default value)

      4. No warning for _ prefix variables

      5. No warning when variable name does not match any param

      6. Explicit None suppression: Foo(x=None) — no warning

      7. Silent skip for unresolvable callee (third-party import)

      Function has @pre/@post contracts matching dead_export.py pattern.

      Callee resolution uses FileInfo symbol table (not ad-hoc AST parsing).'
    refs:
    - src/invar/core/
    - src/invar/core/dead_export.py
