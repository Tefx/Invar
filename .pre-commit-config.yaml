# Invar Pre-commit Hooks
# Install: pip install pre-commit && pre-commit install
#
# Smart Guard: Detects rule-affecting file changes and runs full guard when needed.
# This prevents "works locally, fails in CI" issues when rule severity is upgraded.

repos:
  - repo: local
    hooks:
      # Ruff - Fast Python linter (catches import sorting, code style issues)
      - id: ruff-check
        name: Ruff Check
        entry: bash -c 'source .venv/bin/activate && ruff check src/invar/'
        language: system
        pass_filenames: false
        stages: [pre-commit]
        types: [python]

      # Smart Invar Guard - Architecture verification
      # Runs full guard when rule files are modified, --changed otherwise
      - id: invar-guard
        name: Invar Guard
        entry: bash scripts/smart-guard.sh
        language: system
        pass_filenames: false
        stages: [pre-commit]
        types: [python]

      # Pytest with doctests - Logic verification
      - id: pytest-doctest
        name: Pytest Doctests
        entry: bash -c 'source .venv/bin/activate && pytest --doctest-modules src/ -q --tb=short'
        language: system
        pass_filenames: false
        stages: [pre-commit]
        types: [python]
