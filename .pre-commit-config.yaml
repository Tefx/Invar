# Invar Pre-commit Hooks
# Install: pip install pre-commit && pre-commit install

repos:
  - repo: local
    hooks:
      # Invar Guard - Architecture verification
      - id: invar-guard
        name: Invar Guard
        entry: bash -c 'source .venv/bin/activate && invar guard --changed'
        language: system
        pass_filenames: false
        stages: [pre-commit]
        types: [python]

      # Pytest with doctests - Logic verification
      - id: pytest-doctest
        name: Pytest Doctests
        entry: bash -c 'source .venv/bin/activate && pytest --doctest-modules src/ -q --tb=short'
        language: system
        pass_filenames: false
        stages: [pre-commit]
        types: [python]
