# DX-91: Minimal template manifest

[meta]
version = "5.0"
workflow = "contracts-first"

[ownership]
fully_managed = [
    "INVAR.md",
]

partially_managed = [
    "CLAUDE.md",
]

never_touch = [
    ".claude/settings*.json",
    ".mcp.json",
    ".cursorrules",
    ".aider*",
    ".invar/config.toml",
]

[regions."CLAUDE.md"]
managed = { action = "overwrite" }
project = { action = "inject", source = ".invar/project-additions.md" }
user = { action = "preserve" }

[templates]
"INVAR.md" = { src = "protocol/INVAR.md.v2.jinja", type = "jinja" }
"CLAUDE.md" = { src = "config/CLAUDE.md.v2.jinja", type = "jinja" }
".pre-commit-config.yaml" = { src = "config/pre-commit.yaml.jinja", type = "jinja" }

[variables]
syntax = "cli"
language = "python"
version = "5.0"
project_name = ""

[commands.init]
creates = [
    "INVAR.md",
    "CLAUDE.md",
    ".pre-commit-config.yaml",
]
syntax = "cli"

[commands.dev_sync]
syntax = "mcp"
inject_project_additions = true

[sync]
fully_managed = [
    "INVAR.md",
]

region_managed = [
    "CLAUDE.md",
]

create_only = [
    ".pre-commit-config.yaml",
]
