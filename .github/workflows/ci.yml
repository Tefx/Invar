name: CI

on:
  push:
    branches: [Main, main]
  pull_request:
    branches: [Main, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install crosshair-tool  # DX-14: Required for --prove

      - name: Run tests with pytest
        run: |
          pytest --doctest-modules src/invar/ -v

      # DX-14: CI uses --prove for symbolic verification
      # DX-13: Incremental mode makes this fast (~8s instead of 6+ min)
      # Note: continue-on-error because CrossHair finds different edge cases
      # across Python versions (3.11 vs 3.14). Failures are informational.
      - name: Run Invar Guard with Proof
        run: |
          invar guard --prove
        continue-on-error: true

      - name: Check types with mypy
        run: |
          mypy src/invar/ --ignore-missing-imports
        continue-on-error: true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check src/invar/

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
